# UtsuroClip の動画生成用 Codex 設定。
model = "gpt-6-sol"
model_reasoning_effort = "medium"
model_context_window = 1000000

approval_policy = "on-request"

default_permissions = "workspace_write"

[permissions.workspace_write]
extends = ":workspace"

[permissions.workspace_write.filesystem.":workspace_roots"]
".git" = "write"

[permissions.workspace_write.network]
enabled = true
allow_local_binding = true

[features.network_proxy]
enabled = true
domains = { "127.0.0.1" = "allow" }