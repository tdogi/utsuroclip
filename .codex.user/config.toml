# UtsuroClip の動画生成用 Codex 設定。
# setup.sh の通常モードで .codex/config.toml に配置されます。
model = "gpt-6-sol"
model_reasoning_effort = "medium"
model_context_window = 1000000

approval_policy = "on-request"

[permissions.workspace_write]
extends = ":workspace"

[permissions.workspace_write.filesystem.":project_roots"]
".git" = "write"

# VOICEVOX Engine のローカル API だけを利用できるようにする。
[sandbox_workspace_write]
network_access = true

[features.network_proxy]
enabled = true
domains = { "127.0.0.1" = "allow" }
